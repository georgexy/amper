# Amper: jurnalul sistemului păstrat pe card (instalat ca /etc/systemd/journald.conf.d/50-amper.conf).
# Raspberry Pi OS îl ține implicit doar în RAM (/usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf,
# Storage=volatile): se pierdea la repornire sau după câteva ore, cu tot cu motivul unei copii de siguranță eșuate.
# Numărul 50 bate fișierul 40-… (fișierele se citesc în ordinea numelui, ultimul câștigă).
# SyncIntervalSec rămâne cel implicit (5 min): scrieri rare pe card.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=1month
