# Lansarea unei versiuni Amper: arhivă + manifest semnat Ed25519, publicate ca GitHub Release.
#
# Cum se lansează (după ce versiunea din amper/__init__.py și CHANGELOG.md sunt pe main):
#   GitHub → Actions → „Lansează versiunea” → Run workflow   (merge și de pe telefon)
#   sau: un tag v<versiune> (ex. v1.3.0) împins pe GitHub.
# O versiune cu sufix (1.3.0-beta.1) iese ca „pre-release”: o primesc doar Pi-urile pe canalul beta.
# „Urgentă” (bifă la Run workflow): Pi-urile o instalează singure în câteva ore, fără să apese nimeni nimic
# (pentru o problemă care trebuie reparată peste tot; aceleași verificări și revenire automată).
# Cheia privată: secretul repo-ului AMPER_SIGNING_KEY (vezi `python tools/release.py keygen`).
name: Lansează versiunea

on:
  workflow_dispatch:
    inputs:
      urgent:
        description: "Urgentă: Pi-urile o instalează singure (doar pentru reparații care nu pot aștepta)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pachete
        run: pip install aiohttp pyserial pyyaml cryptography pytest

      - name: Versiunea
        id: ver
        run: |
          VER="$(python tools/release.py version)"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VER" ]; then
            echo "::error::Tag-ul ${GITHUB_REF_NAME} nu se potrivește cu versiunea din amper/__init__.py ($VER)"
            exit 1
          fi
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "::error::Versiunea v$VER e deja publicată. Mărește __version__ în amper/__init__.py."
            exit 1
          fi
          python tools/release.py notes "$VER" > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Teste
        run: python -m pytest -q

      - name: Arhiva și semnătura
        run: |
          python tools/release.py build --out dist $URGENT
          python tools/release.py verify dist
        env:
          AMPER_SIGNING_KEY: ${{ secrets.AMPER_SIGNING_KEY }}
          URGENT: ${{ inputs.urgent && '--urgent' || '' }}

      - name: Publicare pe GitHub
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          PRE=""
          case "$VER" in *-*) PRE="--prerelease" ;; esac
          gh release create "v$VER" dist/amper-*.tar.gz dist/manifest.json dist/manifest.json.sig \
            --title "Amper $VER" --notes-file dist/notes.md --target "$GITHUB_SHA" $PRE
        env:
          GH_TOKEN: ${{ github.token }}
