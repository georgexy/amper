# Site-ul de prezentare (folderul site/) pe GitHub Pages: https://georgexy.github.io/amper/
# O singură dată: Settings → Pages → Source: „GitHub Actions”.
name: Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
